# Configuration file for diatomic molecule analysis

# General settings
temperature: 298.15  # Kelvin
pressure: 101325    # Pa (1 atm)
fmax: 0.001        # Convergence criterion for geometry optimization
max_steps: 100     # Maximum optimization steps

# Molecule definitions
molecules:
  N2:
    symbols: ['N', 'N']
    initial_distance: 1.2
    mass: 28.0134
    spin: 0
    symmetry: 2
    geometry: 'linear'
    reference:
      d_eq: 1.0977
      D_e: 9.76
      freq: 2358.6
  
  H2:
    symbols: ['H', 'H']
    initial_distance: 0.8
    mass: 2.01588
    spin: 0
    symmetry: 2
    geometry: 'linear'
    reference:
      d_eq: 0.7414
      D_e: 4.52
      freq: 4401.2
  
  F2:
    symbols: ['F', 'F']
    initial_distance: 1.4
    mass: 37.9968
    spin: 0
    symmetry: 2
    geometry: 'linear'
    reference:
      d_eq: 1.4119
      D_e: 1.60
      freq: 917.0
  
  O2:
    symbols: ['O', 'O']
    initial_distance: 1.3
    mass: 31.9988
    spin: 1
    symmetry: 2
    geometry: 'linear'
    reference:
      d_eq: 1.2075
      D_e: 5.12
      freq: 1580.2

# Calculator settings
calculators:
  # EMT settings
  EMT:
    enabled: true
    # No additional parameters needed
  
  # MACE settings
  MACE:
    enabled: false  # Set to true if you have MACE installed
    model: 'MACE'   # Options: 'MACE', 'MACE_mp0', 'MACE_mp1', etc.
    device: 'cpu'   # 'cpu' or 'cuda'
    model_path: null  # Path to custom model file if needed

# Output settings
output:
  save_structures: true
  save_trajectories: true
  verbose: true
  output_dir: 'results'
