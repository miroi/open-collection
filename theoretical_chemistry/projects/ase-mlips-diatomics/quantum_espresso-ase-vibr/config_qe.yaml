# Configuration file for diatomic molecule analysis with Quantum ESPRESSO
# Using ASE Vibrations for vibrational analysis

# General settings
general:
  temperature: 298.15
  pressure: 101325
  fmax: 0.001
  max_steps: 100
  verbose: true

# Select which molecules to calculate (set to true/false)
molecules_to_calculate:
  N2: true
  H2: false
  O2: false
  F2: false
  Cl2: false
  # Add more molecules as needed:
  # CO: true
  # NO: true
  # HF: true

# Molecule definitions with experimental reference values
molecules:
  N2:
    symbols: ['N', 'N']
    initial_distance: 1.2
    mass: 28.0134
    spin: 0
    symmetry: 2
    geometry: 'linear'
    reference:
      d_eq: 1.0977      # Experimental bond length (Å)
      freq: 2358.6      # Experimental vibrational frequency (cm⁻¹)
      source: "NIST Chemistry WebBook"
  
  H2:
    symbols: ['H', 'H']
    initial_distance: 0.8
    mass: 2.01588
    spin: 0
    symmetry: 2
    geometry: 'linear'
    reference:
      d_eq: 0.7414
      freq: 4401.2
      source: "NIST Chemistry WebBook"
  
  O2:
    symbols: ['O', 'O']
    initial_distance: 1.3
    mass: 31.9988
    spin: 1
    symmetry: 2
    geometry: 'linear'
    reference:
      d_eq: 1.2075
      freq: 1580.2
      source: "NIST Chemistry WebBook"
  
  F2:
    symbols: ['F', 'F']
    initial_distance: 1.4
    mass: 37.9968
    spin: 0
    symmetry: 2
    geometry: 'linear'
    reference:
      d_eq: 1.4119
      freq: 917.0
      source: "NIST Chemistry WebBook"
  
  Cl2:
    symbols: ['Cl', 'Cl']
    initial_distance: 2.0
    mass: 70.906
    spin: 0
    symmetry: 2
    geometry: 'linear'
    reference:
      d_eq: 1.9879
      freq: 559.7
      source: "NIST Chemistry WebBook"
  
  # Additional molecules (commented out by default)
