# =============================================================================
# FILE: config_qe.yaml
# Configuration file for diatomic molecule analysis with Quantum ESPRESSO
# =============================================================================

# General settings
general:
  temperature: 298.15
  pressure: 101325
  fmax: 0.001
  max_steps: 100
  verbose: true

# Select which molecules to calculate
molecules_to_calculate:
  N2: true
  H2: false
  O2: false
  F2: false
  Cl2: false

# Molecule definitions
molecules:
  N2:
    symbols: ['N', 'N']
    initial_distance: 1.2
    mass: 28.0134
    spin: 0
    symmetry: 2
    geometry: 'linear'
    eq_distance: 1.1100  # Skip geometry optimization
   # only_geometry_optimization: true
    reference:
      d_eq: 1.0977
      freq: 2358.6
      source: "NIST Chemistry WebBook"
  
  H2:
    symbols: ['H', 'H']
    initial_distance: 0.8
    mass: 2.01588
    spin: 0
    symmetry: 2
    geometry: 'linear'
    # eq_distance: 0.7790
    reference:
      d_eq: 0.7414
      freq: 4401.2
      source: "NIST Chemistry WebBook"
  
  O2:
    symbols: ['O', 'O']
    initial_distance: 1.3
    mass: 31.9988
    spin: 1
    symmetry: 2
    geometry: 'linear'
    # eq_distance: 1.1003
    reference:
      d_eq: 1.2075
      freq: 1580.2
      source: "NIST Chemistry WebBook"
  
  F2:
    symbols: ['F', 'F']
    initial_distance: 1.4
    mass: 37.9968
    spin: 0
    symmetry: 2
    geometry: 'linear'
    # eq_distance: 1.4191
    reference:
      d_eq: 1.4119
      freq: 917.0
      source: "NIST Chemistry WebBook"
  
  Cl2:
    symbols: ['Cl', 'Cl']
    initial_distance: 2.0
    mass: 70.906
    spin: 0
    symmetry: 2
    geometry: 'linear'
    # eq_distance: 1.9879
    reference:
      d_eq: 1.9879
      freq: 559.7
      source: "NIST Chemistry WebBook"

# Quantum ESPRESSO settings
qe:
  parallel:
    use_mpi: true
    nprocs: 4
    mpi_command: 'mpirun'
  
  pseudo_dir: './pseudopotentials/'
  pseudopotentials:
   # N: 'N.upf'
    N: 'N.pbe-n-kjpaw_psl.1.0.0.UPF'
    H: 'H.upf'
    O: 'O.upf'
    F: 'F.upf'
    Cl: 'Cl.upf'
  
  # ============================================================
  # ============================================================
  ecutwfc: 80.0   
  ecutrho: 640.0 
  kpts: [1, 1, 1]
  smearing: 'gaussian'
  degauss: 0.01
  conv_thr: 1.0e-10
  mixing_beta: 0.7
  electron_maxstep: 200
  
  # Vibration settings
  # Options: '1d', 'xonly', 'full', '1d+xonly', '1d+full', 'xonly+full', 'all'
  vibration_method: '1d+xonly'  # Run both methods for comparison
  
  # 1D Scan parameters
  1d_settings:
    delta: 0.01
    n_points: 9
    refined_delta: 0.005
    refined_n_points: 11
  
  # X-Only Hessian parameters
  xonly_settings:
    delta: 0.001
    nfree: 2
  
  # Full 3D Hessian parameters
  full_settings:
    delta: 0.001
    nfree: 2

# Output settings
output:
  save_structures: true
  save_trajectories: true
  verbose: true
  output_dir: 'results_qe'
