# Quantum ESPRESSO settings
qe:
  # Parallelization
  parallel:
    use_mpi: true
    nprocs: 4
    mpi_command: 'mpirun'
  
  # Pseudopotentials
  pseudo_dir: './pseudopotentials/'
  pseudopotentials:
    H: 'H.upf'
    N: 'N.upf'
    O: 'O.upf'
    F: 'F.upf'
    Cl: 'Cl.upf'
    # For additional elements, uncomment and add:
    # C: 'C.upf'
  
  # SCF parameters
  ecutwfc: 80.0
  #ecutrho: 320.0
  kpts: [1, 1, 1]
  smearing: 'gaussian'
  degauss: 0.01
  conv_thr: 1.0e-10
  mixing_beta: 0.7
  electron_maxstep: 200
  
  # Vibration settings
  vibration_method: 'full'  # Options: '1d' (fast) or 'full' (full Hessian)
  delta: 0.005              # Displacement for finite differences
  nfree: 2                  # Number of displacements per direction (for 'full' method)
  n_points: 7               # Number of points for 1D scan (for '1d' method)

# Output settings
output:
  save_structures: true
  save_trajectories: true
  verbose: true
  output_dir: 'results_qe'
