# =============================================================================
# FILE: config_qe.yaml
# Configuration file for diatomic molecule analysis with Quantum ESPRESSO
# Using PAW pseudopotentials (N.pbe-n-kjpaw_psl.1.0.0.UPF)
# =============================================================================

# General settings
general:
  temperature: 298.15
  pressure: 101325
  fmax: 0.001
  max_steps: 100
  verbose: true

# Select which molecules to calculate
molecules_to_calculate:
  N2: true
  H2: false
  O2: false
  F2: false
  Cl2: false

# Molecule definitions
molecules:
  N2:
    symbols: ['N', 'N']
    initial_distance: 1.2
    mass: 28.0134
    spin: 0
    symmetry: 2
    geometry: 'linear'
    #eq_distance: 1.1100  # Skip geometry optimization
    # only_geometry_optimization: true
    reference:
      d_eq: 1.0977
      freq: 2358.6
      source: "NIST Chemistry WebBook"

# Quantum ESPRESSO settings
qe:
  parallel:
    use_mpi: true
    nprocs: 4
    mpi_command: 'mpirun'
  
  pseudo_dir: './pseudopotentials/'
  pseudopotentials:
    N: 'N.pbe-n-kjpaw_psl.1.0.0.UPF'  # PAW pseudopotential (recommended)
    H: 'H.pbe-n-kjpaw_psl.1.0.0.UPF'
    O: 'O.pbe-n-kjpaw_psl.1.0.0.UPF'
    F: 'F.pbe-n-kjpaw_psl.1.0.0.UPF'
    Cl: 'Cl.pbe-n-kjpaw_psl.1.0.0.UPF'
  
  # ============================================================
  # For PAW pseudopotentials (pbe-n-kjpaw_psl):
  # Use high ecutrho (8x ecutwfc) for accuracy
  # ============================================================
  ecutwfc: 80.0
  ecutrho: 640.0
  kpts: [1, 1, 1]
  smearing: 'gaussian'
  degauss: 0.01
  conv_thr: 1.0e-10
  mixing_beta: 0.7
  electron_maxstep: 200
  
  # Vibration settings - Use 'full' for best accuracy
  vibration_method: 'full'  # Use full Vibrations class
  
  # Full 3D Hessian parameters
  full_settings:
    delta: 0.01           # Same as your working script
    nfree: 2

# Output settings
output:
  save_structures: true
  save_trajectories: true
  verbose: true
  output_dir: 'results_qe'
