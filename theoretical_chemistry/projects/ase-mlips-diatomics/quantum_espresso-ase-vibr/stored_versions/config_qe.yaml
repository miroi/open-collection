# Configuration file for diatomic molecule analysis with Quantum ESPRESSO
# Using 1D scan for fast vibrational frequencies

# General settings
general:
  temperature: 298.15
  pressure: 101325
  fmax: 0.001
  max_steps: 100
  verbose: true

# Molecule definitions
molecules:
  N2:
    symbols: ['N', 'N']
    initial_distance: 1.2
    mass: 28.0134
    spin: 0
    symmetry: 2
    geometry: 'linear'
    reference:
      d_eq: 1.0977
      freq: 2358.6
  
  H2:
    symbols: ['H', 'H']
    initial_distance: 0.8
    mass: 2.01588
    spin: 0
    symmetry: 2
    geometry: 'linear'
    reference:
      d_eq: 0.7414
      freq: 4401.2
  
  O2:
    symbols: ['O', 'O']
    initial_distance: 1.3
    mass: 31.9988
    spin: 1
    symmetry: 2
    geometry: 'linear'
    reference:
      d_eq: 1.2075
      freq: 1580.2
  
  F2:
    symbols: ['F', 'F']
    initial_distance: 1.4
    mass: 37.9968
    spin: 0
    symmetry: 2
    geometry: 'linear'
    reference:
      d_eq: 1.4119
      freq: 917.0
  
  Cl2:
    symbols: ['Cl', 'Cl']
    initial_distance: 2.0
    mass: 70.906
    spin: 0
    symmetry: 2
    geometry: 'linear'
    reference:
      d_eq: 1.9879
      freq: 559.7

# Quantum ESPRESSO settings
qe:
  # Parallelization
  parallel:
    use_mpi: true
    nprocs: 4
    mpi_command: 'mpirun'
  
  # Pseudopotentials
  pseudo_dir: './pseudopotentials/'
  pseudopotentials:
    H: 'H.upf'
    N: 'N.upf'
    O: 'O.upf'
    F: 'F.upf'
    Cl: 'Cl.upf'
  
  # SCF parameters
  ecutwfc: 80.0
  ecutrho: 320.0
  kpts: [1, 1, 1]
  smearing: 'gaussian'
  degauss: 0.01
  conv_thr: 1.0e-10
  mixing_beta: 0.7
  electron_maxstep: 200
  
  # 1D Vibration settings (new)
  delta: 0.005         # Displacement for 1D scan
  n_points: 7          # Number of points for 1D scan (odd number recommended)

# Output settings
output:
  save_structures: true
  save_trajectories: true
  verbose: true
  output_dir: 'results_qe'
