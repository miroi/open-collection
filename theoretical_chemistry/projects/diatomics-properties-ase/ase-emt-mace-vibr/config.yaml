# Configuration file for diatomic molecule analysis
# ================================================

# General settings
general:
  fmax: 0.001        # Convergence criterion for geometry optimization
  max_steps: 100     # Maximum optimization steps
  compare_with_reference: true
  verbose: true

# Molecule definitions with their properties and reference values
molecules:
  N2:
    symbols: ['N', 'N']
    initial_distance: 1.2
    spin: 0
    symmetry: 2
    geometry: 'linear'
    # eq_distance: 1.1031  # Uncomment to skip geometry optimization
    reference:
      d_eq: 1.0977
      freq: 2358.6
  
  H2:
    symbols: ['H', 'H']
    initial_distance: 0.8
    spin: 0
    symmetry: 2
    geometry: 'linear'
    # eq_distance: 0.7790
    reference:
      d_eq: 0.7414
      freq: 4401.2
  
  F2:
    symbols: ['F', 'F']
    initial_distance: 1.4
    spin: 0
    symmetry: 2
    geometry: 'linear'
    # eq_distance: 1.4191
    reference:
      d_eq: 1.4119
      freq: 917.0
  
  O2:
    symbols: ['O', 'O']
    initial_distance: 1.3
    spin: 1
    symmetry: 2
    geometry: 'linear'
    # eq_distance: 1.1003
    reference:
      d_eq: 1.2075
      freq: 1580.2

# Calculator settings
calculators:
  EMT:
    enabled: true
  
  MACE:
    enabled: true
    model: 'MACE'
    device: 'cuda'
    model_path: '/home/milias/.cache/mace/checkpoints/mace-mp-0b3-medium.model'

# Output settings
output:
  save_structures: true
  save_trajectories: true
  verbose: true
  output_dir: 'results'

# Advanced settings - Using ASE Vibrations (Full Hessian)
advanced:
  vibrations:
    delta: 0.01           # Displacement for finite differences (Å)
                          # - Larger delta (0.01) gives better numerical stability
                          # - Smaller delta (0.005) gives better accuracy
                          # - 0.01 is recommended for most calculations
    nfree: 2              # Number of displacements per direction
                          # - nfree=2 gives 24 SCF calculations for diatomics
                          # - Higher nfree = more accurate but slower
  
  optimization:
    algorithm: 'BFGS'
    max_steps: 100
    fmax: 0.0005
