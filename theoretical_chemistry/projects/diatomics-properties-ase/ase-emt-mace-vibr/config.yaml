# Configuration file for diatomic molecule analysis
# ================================================

# General settings
general:
  fmax: 0.001        # Convergence criterion for geometry optimization
  max_steps: 100     # Maximum optimization steps
  compare_with_reference: true
  verbose: true

# Molecule definitions with their properties and reference values
molecules:
  N2:
    symbols: ['N', 'N']
    initial_distance: 1.2
    mass: 28.0134
    spin: 0
    symmetry: 2
    geometry: 'linear'
    # eq_distance: 1.1031  # Uncomment to skip geometry optimization
    reference:
      d_eq: 1.0977
      D_e: 9.76
      freq: 2358.6
  
  H2:
    symbols: ['H', 'H']
    initial_distance: 0.8
    mass: 2.01588
    spin: 0
    symmetry: 2
    geometry: 'linear'
    # eq_distance: 0.7790
    reference:
      d_eq: 0.7414
      D_e: 4.52
      freq: 4401.2
  
  F2:
    symbols: ['F', 'F']
    initial_distance: 1.4
    mass: 37.9968
    spin: 0
    symmetry: 2
    geometry: 'linear'
    # eq_distance: 1.4191
    reference:
      d_eq: 1.4119
      D_e: 1.60
      freq: 917.0
  
  O2:
    symbols: ['O', 'O']
    initial_distance: 1.3
    mass: 31.9988
    spin: 1
    symmetry: 2
    geometry: 'linear'
    # eq_distance: 1.1003
    reference:
      d_eq: 1.2075
      D_e: 5.12
      freq: 1580.2

# Calculator settings
calculators:
  EMT:
    enabled: true
  
  MACE:
    enabled: true
    model: 'MACE'
    device: 'cuda'
    model_path: '/home/milias/.cache/mace/checkpoints/mace-mp-0b3-medium.model'

# Output settings
output:
  save_structures: true
  save_trajectories: true
  verbose: true
  output_dir: 'results'

# Advanced settings
advanced:
  vibrations:
    delta: 0.005          # Displacement for finite differences
    nfree: 4              # Number of displacements per mode
    method: 'numeric'     # Options: 'freq', 'polyfit', 'numeric'
  
  optimization:
    algorithm: 'BFGS'
    max_steps: 100
    fmax: 0.0005
