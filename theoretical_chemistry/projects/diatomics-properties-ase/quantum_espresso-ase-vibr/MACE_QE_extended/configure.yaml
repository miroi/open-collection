# =============================================================================
# FILE: configure.yaml
# Configuration file for diatomic molecule analysis with Quantum ESPRESSO
# Using PAW pseudopotentials (N.pbe-n-kjpaw_psl.1.0.0.UPF)
# =============================================================================

# General settings
general:
  temperature: 298.15
  pressure: 101325
  fmax: 0.001
  max_steps: 100
  verbose: true

# Select which molecules to calculate
molecules_to_calculate:
  N2: true
  H2: false
  O2: false
  F2: false
  Cl2: false
  HCl: false   # Added: Hydrogen Chloride (set to true to calculate)
  HF: false    # Added: Hydrogen Fluoride (set to true to calculate)

# Molecule definitions
mace, qe, mace+qe

# Quantum ESPRESSO settings
qe:
  parallel:
    use_mpi: true
    nprocs: 4
    mpi_command: 'mpirun'

  pseudo_dir: './pseudopotentials/'
  pseudopotentials:
    N: 'N.pbe-n-kjpaw_psl.1.0.0.UPF'  # PAW pseudopotential (recommended)
    H: 'H.pbe-kjpaw_psl.1.0.0.UPF'
    O: 'O.pbe-n-kjpaw_psl.1.0.0.UPF'
    F: 'F.pbe-n-kjpaw_psl.1.0.0.UPF'
    Cl: 'Cl.pbe-n-kjpaw_psl.1.0.0.UPF'

  # ============================================================
  # For PAW pseudopotentials (pbe-n-kjpaw_psl):
  # Use high ecutrho (8x ecutwfc) for accuracy
  # ============================================================
  ecutwfc: 80.0
  ecutrho: 640.0
  kpts: [1, 1, 1]
  smearing: 'gaussian'
  degauss: 0.01
  conv_thr: 1.0e-10
  mixing_beta: 0.7
  electron_maxstep: 200

  # --------------------------------------------------------------------------
  # VIBRATION METHOD SELECTION
  # --------------------------------------------------------------------------
  #
  # Available vibration calculation methods:
  #
  #   '1d'
  #       Standard 1D bond scan.
  #       The potential energy surface is sampled by changing only the
  #       internuclear distance. A quadratic fit around the equilibrium bond
  #       length is used to obtain the force constant and harmonic frequency.
  #       Fastest method, suitable for quick estimates.
  #
  #   '1d_r'
  #       Refined 1D bond scan.
  #       Similar to '1d', but uses a denser scan and a smaller displacement
  #       range. The energy curve is fitted with a higher-order polynomial
  #       for improved curvature determination.
  #       More accurate than '1d', but requires additional energy evaluations.
  #
  #   'xonly'
  #       X-Only Hessian calculation.
  #       Manual finite-difference displacement along the molecular bond axis
  #       (x direction only). The Hessian is obtained directly from energy
  #       changes caused by atomic displacements.
  #       More accurate than a simple 1D scan while remaining efficient for
  #       diatomic molecules.
  #
  #   'full'
  #       Full 3D Hessian calculation.
  #       Uses the ASE Vibrations framework to calculate the complete Hessian
  #       matrix including all Cartesian displacement directions.
  #       Most general and accurate method, but computationally the most
  #       expensive.
  #
  # --------------------------------------------------------------------------
  # Combination methods:
  #
  #   '1d+xonly'
  #       Run standard 1D scan and X-Only Hessian.
  #       Allows comparison between a simple PES fit and finite-difference
  #       Hessian calculation.
  #
  #   '1d_r+xonly'
  #       Run refined 1D scan and X-Only Hessian.
  #       Recommended for high-accuracy diatomic frequency calculations while
  #       avoiding the cost of a full Hessian.
  #
  #   '1d+1d_r'
  #       Run both standard and refined 1D scans.
  #       Useful for evaluating convergence of the 1D scan with respect to
  #       displacement range and sampling density.
  #
  #   '1d+1d_r+xonly'
  #       Run standard 1D scan, refined 1D scan, and X-Only Hessian.
  #       Provides a detailed comparison of three bond-stretching approaches.
  #
  #   '1d+full'
  #       Run standard 1D scan and full 3D Hessian.
  #
  #   '1d_r+full'
  #       Run refined 1D scan and full 3D Hessian.
  #
  #   'xonly+full'
  #       Run X-Only Hessian and full 3D Hessian.
  #
  #   '1d+1d_r+full'
  #       Run both 1D methods and the full 3D Hessian.
  #
  #   '1d+1d_r+xonly+full'
  #       Run every available vibration method:
  #       standard 1D scan,
  #       refined 1D scan,
  #       X-Only Hessian,
  #       full 3D Hessian.
  #
  #   'all'
  #       Run ALL available vibration methods.
  #       Equivalent to:
  #       '1d+1d_r+xonly+full'
  #
  # --------------------------------------------------------------------------

  #vibration_method: '1d+xonly'  # Use full Vibrations class
  vibration_method: 'all'  # Use full Vibrations class

  # --------------------------------------------------------------------------
  # METHOD 1: 1D SCAN PARAMETERS (Fast, but less accurate for flat PES)
  # --------------------------------------------------------------------------
  # How it works: Fits a quadratic polynomial to the PES along the bond
  # Pros: Very fast (only n_points SCF calculations)
  # Cons: Less accurate, sensitive to numerical noise
  # Best for: Quick screening, qualitative analysis
  # --------------------------------------------------------------------------
  1d_settings:
    delta: 0.01                                  # Scan range: ±delta (Å)
                                                  #   - Too small: numerical noise
                                                  #   - Too large: anharmonic effects
                                                  #   - Recommended: 0.001-0.005 Å
    n_points: 9                                   # Number of points for quadratic fit
                                                  #   - Must be odd (center point at equilibrium)
                                                  #   - 7-11 points recommended
    refined_delta: 0.005                         # Refined scan range (Å)
                                                  #   - Smaller range for higher accuracy
                                                  #   - Recommended: 0.0005-0.001 Å
    refined_n_points: 11                          # Points for refined scan
                                                  #   - More points = better fit
                                                  #   - Recommended: 9-13 points

  # --------------------------------------------------------------------------
  # METHOD 2: X-ONLY HESSIAN PARAMETERS (Accurate, only along bond)
  # --------------------------------------------------------------------------
  # How it works: Uses FixAtoms to freeze y,z and manually displaces along x
  # Pros: Full Hessian accuracy for stretching mode, only 4 SCF calcs
  # Cons: Requires FixAtoms constraint, manual displacement
  # Best for: Fast accurate frequencies for diatomics
  # --------------------------------------------------------------------------
  xonly_settings:
    delta: 0.01                                  # Displacement range (Å)
                                                  #   - Step size for displacement
                                                  #   - Recommended: 0.001-0.005 Å
    nfree: 2                                      # Number of displacements per direction
                                                  #   - Total calcs = 2 × nfree (only x-direction)
                                                  #   - nfree=2 gives 4 SCF calculations
                                                  #   - Higher nfree = more accurate but slower

  # --------------------------------------------------------------------------
  # METHOD 3: FULL HESSIAN PARAMETERS (Most accurate, uses ASE Vibrations)
  # --------------------------------------------------------------------------
  # How it works: Uses ASE's Vibrations class for full 3D Hessian
  # Pros: Most accurate, complete vibrational analysis
  # Cons: Slow (24 SCF calculations for diatomics with nfree=2)
  # Best for: Final accurate frequencies, benchmark calculations
  # --------------------------------------------------------------------------
  full_settings:
    delta: 0.01                                   # Displacement for finite differences (Å)
                                                  #   - Same as your working script
                                                  #   - Recommended: 0.005-0.01 Å
                                                  #   - Too small: numerical noise
                                                  #   - Too large: anharmonic effects
    nfree: 2                                      # Number of displacements per direction
                                                  #   - Total calcs = 2 × atoms × 3 × nfree
                                                  #   - For N2: 2 × 2 × 3 × 2 = 24 SCF calcs
                                                  #   - nfree=2 recommended
                                                  #   - Higher nfree = more accurate but slower

# Output settings
output:
  save_structures: true
  save_trajectories: true
  verbose: true
  output_dir: 'results_qe'
